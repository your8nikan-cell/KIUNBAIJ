services:
  dependencies:
    image: node:22-bookworm-slim
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command: [sh, -ec, 'npm ci --no-audit --no-fund']
  web:
    image: node:22-bookworm-slim
    restart: on-failure
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    ports:
      - '3000:5173'
    command: [sh, -ec, 'exec npm run dev']
    depends_on:
      dependencies:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:5173/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
  api:
    image: node:22-bookworm-slim
    restart: on-failure
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - application_data:/data
    environment:
      PORT: '8000'
      DATA_DIR: /data
    command: [sh, -ec, 'exec npm run dev:api']
    depends_on:
      dependencies:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8000/api/status').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 3
volumes:
  node_modules:
  application_data:
